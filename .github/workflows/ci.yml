name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Install pinned Pi CLI
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1

      - name: Validate dependency lock
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Compile
        run: python -m compileall -q src

      - name: Smoke Pi RPC and extension
        run: uv run scholar-harness pi-smoke

      - name: Smoke offline benchmark
        run: >-
          uv run scholar-harness benchmark
          --papers 5 --passages-per-paper 2 --queries 3 --trace-events 10

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload package artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: scholar-harness-dist
          path: dist/
          if-no-files-found: error
