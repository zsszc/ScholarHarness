[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-harness"
version = "0.1.0"
description = "A runtime-agnostic research agent harness with Pi integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScholarHarness contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=6,<7",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
scholar-harness = "scholar_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
